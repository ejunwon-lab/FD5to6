name: Deploy Web Desk to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-desk/**'
      - '.github/workflows/deploy-web-desk.yml'
  workflow_dispatch:

# 두 배포(web·web-desk)가 같은 gh-pages 브랜치에 push → 동시 실행 시 늦은 쪽 non-fast-forward 거부(errors.md 2026-10-10).
# 공통 그룹으로 직렬화. 같은 그룹 대기 중 run은 최신 1개만 남음(이전 pending 자동 취소 — 최신 커밋이 배포되므로 무해).
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-desk/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-desk

      - name: Test (vitest)
        run: npm test
        working-directory: web-desk

      - name: Build
        run: npm run build
        working-directory: web-desk
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy to GitHub Pages (desk subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web-desk/dist
          destination_dir: desk
          keep_files: true  # web/ + terminal/(이전) 배포물 보존
          commit_message: 'deploy: update web-desk'
