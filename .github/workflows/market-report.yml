name: Market Report (US/KR)

# 거래일 한국시간 08시·17시대에 분석 + Telegram 발송
# - US: 일~목 UTC 23시대 = 월~금 KST 08시대 (전날 미국 마감 리포트)
# - KR: 월~금 UTC 08시대 = 월~금 KST 17시대 (당일 한국 마감 리포트)
#
# 정시화 (2026-06-11, 설계: docs/plans/2026-06-11-market-report-정시화-daisychain.md):
#   GH schedule cron이 best-effort라 KR 리포트가 타깃 17:02 KST 대비 +3.3~3.8h 지연 발화(6/9~11).
#   → telegram-push daisy-chain(24/7 alive, 검증됨)이 창(08:02·17:02 KST) 통과 시
#     `gh workflow run`으로 type=<t> auto=true dispatch(이벤트 구동이라 지연 0) = **정시 발화 주경로**.
#   아래 cron 4개는 **체인 사망 시 재시드 백업으로 강등**(삭제 안 함 — telegram과 동일 패턴).
#
# 멱등 보장 (반복 dispatch 레이스 회피 — errors.md:32 "2회 안전망 race" 동류):
#   - auto=true dispatch: schedule과 동일하게 "오늘 파일 있으면 skip" 가드 적용.
#   - job별 concurrency group: 중복 dispatch는 1 running + 1 pending으로 수렴, pending이
#     이어받을 때 커밋된 파일을 보고 skip → 단일 발송.
#   - 안전망 2회 cron(40분 간격)도 동일 가드로 중복 방지.
#   - 창 가드(2026-10-04, .github/scripts/report_window.sh): 자동 실행(schedule·auto)은 창 안에서만 생성
#     (US 평일 08:00~21:59 / KR 평일 17:00~23:59 / weekly 일 13:00~23:59 KST). 백업 cron이 +7h 지연으로
#     자정을 넘기면 전일 데이터로 "다음 날짜" 파일을 만들어 그날 정규 실행을 skip시켰음(9건, errors.md).
#   - US: KST 08:02 / 08:42, KR: KST 17:02 / 17:42.
# workflow_dispatch(auto 미지정·수동)는 항상 재생성·재발송 (guard 무시).
#
# 요약 우선·신호등 (2026-11-16, 설계: docs/plans/2026-11-16-리포트-요약우선-신호등.md):
#   숫자·날짜·신호 색은 사전 수집 스크립트가 계산(kr_close_prefetch·us_prefetch·weekly_prefetch + signal_rules·mkt),
#   AI는 글만 쓴다. 발송 전 report_finalize.py가 첫 줄의 색을 계산한 색에 맞추고 신호 기록(_signals.jsonl)을 남긴다.
#   리포트 본문의 `===근거===` 줄에서 두 통(요약 → 근거)으로 나눠 보낸다(send_telegram.py).
#   지시문 시험: prompt_dir=_config/next + dry_run=true → 결과는 비공개 저장소 _dryrun/ 에만 저장(공개 로그에 본문을 찍지 않는다).

on:
  schedule:
    - cron: '2 23 * * 0-4'    # US 1차 — KST 08:02
    - cron: '42 23 * * 0-4'   # US 2차 — KST 08:42 (1차 누락 시 백업)
    - cron: '2 8 * * 1-5'     # KR 1차 — KST 17:02
    - cron: '42 8 * * 1-5'    # KR 2차 — KST 17:42
    - cron: '2 4 * * 0'       # 주간 1차 — 일요일 KST 13:02 (지난주 리캡+새주 계획)
    - cron: '42 4 * * 0'      # 주간 2차 — 일요일 KST 13:42 (1차 누락 시 백업)
  workflow_dispatch:
    inputs:
      type:
        description: 'Report type'
        type: choice
        options: [us, kr, both, weekly]
        default: both
      dry_run:
        description: '테스트: 리포트 생성만, 텔레그램 발송·commit 안 함'
        type: boolean
        default: false
      auto:
        description: '자동 dispatch(체인): schedule처럼 오늘 파일 있으면 skip(멱등)'
        type: boolean
        default: false
      prompt_dir:
        description: '지시문 폴더(docs/reports 아래). 새 지시문 시험: _config/next'
        type: string
        default: '_config'
      only_chat:
        description: '보낼 대상 순번(예: 1). 일부만 못 받았을 때 재발송용. 비우면 전원'
        type: string
        default: ''

permissions:
  contents: read   # 이 워크플로는 공개 저장소에 쓰지 않는다. 리포트는 비공개 저장소에 배포 키로 push (2026-11-21)

jobs:
  us-report:
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '2 23 * * 0-4' || github.event.schedule == '42 23 * * 0-4')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'us' || inputs.type == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 생성이 멈추면 기본 6시간을 쓰고 다음 실행을 막는다 (주간이 약 21분)
    # 중복 dispatch 수렴(멱등): 1 running + 1 pending, pending은 가드로 skip
    concurrency:
      group: market-report-us
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # 뒤 단계(외부 글을 읽는 AI)가 토큰을 읽지 못하게

      # 리포트는 private repo(FD5to6-reports)를 docs/reports 경로에 checkout — 기존 경로 참조(프롬프트·가드·weekly) 전부 무수정.
      # 설계: docs/plans/2026-07-04-리포트-private-분리.md
      - name: Checkout reports (private)
        uses: actions/checkout@v4
        with:
          repository: ejunwon-lab/FD5to6-reports
          ssh-key: ${{ secrets.REPORTS_DEPLOY_KEY }}
          path: docs/reports
          persist-credentials: false   # push 는 커밋 단계에서만 키를 다시 받아 한다 (reports_git_auth.sh)

      - name: Skip if already sent today (schedule·auto dispatch)
        id: guard
        run: |
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          REPORT=docs/reports/US-${DATE_KST}.md
          # 가드 적용 대상: schedule 또는 auto=true dispatch (수동 dispatch는 강제 재생성)
          GUARD_ON=no
          [ "${{ github.event_name }}" = "schedule" ] && GUARD_ON=yes
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto }}" = "true" ] && GUARD_ON=yes
          # 창 밖 자동 실행 차단 — 지연 cron이 자정 넘겨 전일 데이터로 다음 날짜 파일을 선생성하는 것 방지 (errors.md 2026-10-04)
          if [ "$GUARD_ON" = "yes" ] && ! bash .github/scripts/report_window.sh us; then
            echo "already=yes" >> $GITHUB_OUTPUT
            echo "⏭️ 창 밖 자동 실행($(TZ='Asia/Seoul' date '+%a %H:%M') KST) — US 리포트 생성 안 함 (지연 cron 날짜 밀림 방지)"
          elif [ "$GUARD_ON" = "yes" ] && [ -f "$REPORT" ]; then
            echo "already=yes" >> $GITHUB_OUTPUT
            echo "⏭️ 오늘(${DATE_KST}) US 리포트 이미 발송됨 — skip"
          else
            echo "already=no" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.guard.outputs.already == 'no'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code CLI
        if: steps.guard.outputs.already == 'no'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 미국 시장 숫자·날짜·신호 색을 코드가 계산해 표로 넘긴다 (2026-11-16 — 11/16 리포트가 5거래일 변화율을 하루 등락으로 적은 사고 뒤).
      # 실패해도 리포트는 계속 — 표 머리의 "실패"를 보고 에이전트가 지시문의 대체 경로를 탄다. 로그에는 개수·상태만.
      - name: Pre-fetch US market (미국 시장 숫자·신호)
        if: steps.guard.outputs.already == 'no'
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
        run: |
          mkdir -p /tmp/us
          OUT=/tmp/us/gas_metrics.json
          if [ -z "$GAS_WEB_APP_URL" ] || [ -z "$TG_WEBHOOK_SECRET" ]; then
            echo '{"success":false,"reason":"env-unset"}' > "$OUT"
            echo "pre-fetch: env unset"
          else
            PAYLOAD=$(jq -n --arg s "$TG_WEBHOOK_SECRET" '{action:"portfolioMetrics", secret:$s}')
            code=$(curl -sS -L -m 60 -o "$OUT" -w '%{http_code}' "$GAS_WEB_APP_URL" \
              -H 'Content-Type: application/json' --data "$PAYLOAD" || echo 000)
            if [ "$code" != "200" ] || ! jq -e '.success == true' "$OUT" >/dev/null 2>&1; then
              echo "{\"success\":false,\"reason\":\"http-$code\"}" > "$OUT"
            fi
            echo "pre-fetch: HTTP=$code success=$(jq -r '.success' "$OUT")"
          fi
          python3 .github/scripts/us_prefetch.py "$OUT" /tmp/us/market.md "$(TZ='Asia/Seoul' date +%Y-%m-%d)" \
            --signals docs/reports/_signals.jsonl --signal-out /tmp/us/signal.json || true

      - name: Generate US report (Claude CLI headless)
        if: steps.guard.outputs.already == 'no'
        env:
          PROMPT_DIR_IN: ${{ inputs.prompt_dir }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 웹앱 주소·공유 비밀값은 이 단계에 주지 않는다 — 외부 글을 읽고 명령을 실행하는 단계다. 필요한 값은 앞의 사전 수집 단계가 파일로 넘긴다 (2026-11-21)
        run: |
          # 파일명 결정론화 + 권한 bypass — 첫 시도 실패 수리 (docs/plans/2026-07-16-US리포트-첫시도실패-수리.md)
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          PDIR="${PROMPT_DIR_IN:-_config}"
          [[ "$PDIR" =~ ^_config(/[A-Za-z0-9_-]+)?$ ]] || PDIR=_config
          PROMPT="docs/reports/${PDIR}/us-prompt.md"
          [ -f "$PROMPT" ] || PROMPT="docs/reports/_config/us-prompt.md"
          echo "지시문: ${PROMPT}"
          claude -p "$(cat "$PROMPT")

          [운영 지시] 저장 파일명은 반드시 docs/reports/US-${DATE_KST}.md — 날짜를 스스로 계산하지 말 것." \
            --allowedTools "WebFetch,Bash,Read,Write" \
            --permission-mode bypassPermissions \
            --max-turns 40 \
            --model claude-sonnet-4-6

      - name: Determine report file path
        if: steps.guard.outputs.already == 'no'
        id: path
        run: |
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          REPORT=docs/reports/US-${DATE_KST}.md
          echo "date_kst=${DATE_KST}" >> $GITHUB_OUTPUT
          echo "report=${REPORT}" >> $GITHUB_OUTPUT
          if [ -f "$REPORT" ]; then
            echo "found=yes" >> $GITHUB_OUTPUT
            echo "✓ found $REPORT"
            wc -c "$REPORT"   # 본문은 공개 로그에 찍지 않는다 — 실제 실행분은 비공개 저장소 커밋, 시험 실행분은 _dryrun/ (2026-11-16)
          else
            echo "found=no" >> $GITHUB_OUTPUT
            echo "✗ not found $REPORT (실패 — 휴장도 직전거래일 폴백으로 파일 생성이 정상, 2026-06-20 PB 개편)"
            ls -la docs/reports/ 2>/dev/null || true
          fi


      # 신호 색을 코드 기준으로 맞추고 형식을 점검, 신호 기록을 남긴다. 실패해도 발송은 계속(스크립트가 항상 exit 0).
      - name: Finalize report (신호 색·형식 점검·신호 기록)
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes'
        env:
          DATE_KST: ${{ steps.path.outputs.date_kst }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          FLAG=""; [ "$DRY" = "true" ] && FLAG="--dry"
          python3 .github/scripts/report_finalize.py us "${{ steps.path.outputs.report }}" \
            --signal /tmp/us/signal.json --log docs/reports/_signals.jsonl $FLAG > /tmp/us/finalize.txt || true
          cat /tmp/us/finalize.txt

      # 무음 실패 제거 — 생성 실패를 텔레그램 경고+빨간 run으로 가시화 (docs/plans/2026-07-03-무음실패-알림.md)
      - name: Alert on generation failure
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'no' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
        run: |
          MSG="⚠️ US 리포트 생성 실패 (${{ steps.path.outputs.date_kst }}) — 파일 미생성. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IFS=',' read -ra IDS <<< "$TG_CHAT_IDS"
          for id in "${IDS[@]}"; do
            curl -sS -m 15 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="$(echo "$id" | tr -d ' ')" --data-urlencode text="$MSG" >/dev/null || true
          done
          exit 1

      - name: Send to Telegram
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          TG_ONLY: ${{ inputs.only_chat }}
        run: |
          python3 .github/scripts/send_telegram.py "${{ steps.path.outputs.report }}"

      - name: Commit report (이력 보존)
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          REPORTS_DEPLOY_KEY: ${{ secrets.REPORTS_DEPLOY_KEY }}
        run: |
          source .github/scripts/reports_git_auth.sh || exit 1
          cd docs/reports
          git config user.email 'actions@github.com'
          git config user.name 'Market Report Bot'
          # 지시문 폴더는 이 실행이 고칠 수 없다 — AI 단계가 건드렸으면 버린다 (다음 실행 오염 방지)
          if [ -n "$(git status --porcelain -- _config)" ]; then
            echo "::warning::_config 변경을 버림 ($(git status --porcelain -- _config | wc -l | tr -d ' ')건)"
            git checkout -q -- _config 2>/dev/null || true
            git clean -fdq -- _config
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "US report ${{ steps.path.outputs.date_kst }} [skip ci]"
            git push
          fi

      # 시험 실행(dry_run) 결과는 공개 로그 대신 비공개 저장소의 _dryrun/ 폴더에 남긴다. 시험이 건드린 다른 파일은 버린다.
      - name: Save dry-run output (private repo _dryrun/)
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          REPORTS_DEPLOY_KEY: ${{ secrets.REPORTS_DEPLOY_KEY }}
        run: |
          source .github/scripts/reports_git_auth.sh || exit 1
          OUT=/tmp/dryrun_out; mkdir -p "$OUT"
          cp "${{ steps.path.outputs.report }}" "$OUT/report.md"
          for f in /tmp/us/market.md /tmp/us/signal.json /tmp/us/finalize.txt docs/reports/_watch.md docs/reports/_events.md; do
            [ -f "$f" ] && cp "$f" "$OUT/" || true
          done
          cd docs/reports
          git checkout -- .
          git clean -fdq
          git pull -q --rebase
          DEST="_dryrun/us-${{ steps.path.outputs.date_kst }}-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp "$OUT"/* "$DEST/"
          git config user.email 'actions@github.com'
          git config user.name 'Market Report Bot'
          git add "$DEST"
          git commit -q -m "dry-run us ${{ steps.path.outputs.date_kst }} [skip ci]"
          if ! git push -q; then
            git pull -q --rebase
            git push -q
          fi
          echo "dry-run 결과 저장: $DEST"

  kr-report:
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '2 8 * * 1-5' || github.event.schedule == '42 8 * * 1-5')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'kr' || inputs.type == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 생성이 멈추면 기본 6시간을 쓰고 다음 실행을 막는다 (주간이 약 21분)
    concurrency:
      group: market-report-kr
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # 뒤 단계(외부 글을 읽는 AI)가 토큰을 읽지 못하게

      # 리포트는 private repo(FD5to6-reports)를 docs/reports 경로에 checkout — 기존 경로 참조(프롬프트·가드·weekly) 전부 무수정.
      # 설계: docs/plans/2026-07-04-리포트-private-분리.md
      - name: Checkout reports (private)
        uses: actions/checkout@v4
        with:
          repository: ejunwon-lab/FD5to6-reports
          ssh-key: ${{ secrets.REPORTS_DEPLOY_KEY }}
          path: docs/reports
          persist-credentials: false   # push 는 커밋 단계에서만 키를 다시 받아 한다 (reports_git_auth.sh)

      - name: Skip if already sent today (schedule·auto dispatch)
        id: guard
        run: |
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          REPORT=docs/reports/KR-${DATE_KST}.md
          GUARD_ON=no
          [ "${{ github.event_name }}" = "schedule" ] && GUARD_ON=yes
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto }}" = "true" ] && GUARD_ON=yes
          # 창 밖 자동 실행 차단 — 지연 cron이 자정 넘겨 전일 데이터로 다음 날짜 파일을 선생성하는 것 방지 (errors.md 2026-10-04)
          if [ "$GUARD_ON" = "yes" ] && ! bash .github/scripts/report_window.sh kr; then
            echo "already=yes" >> $GITHUB_OUTPUT
            echo "⏭️ 창 밖 자동 실행($(TZ='Asia/Seoul' date '+%a %H:%M') KST) — KR 리포트 생성 안 함 (지연 cron 날짜 밀림 방지)"
          elif [ "$GUARD_ON" = "yes" ] && [ -f "$REPORT" ]; then
            echo "already=yes" >> $GITHUB_OUTPUT
            echo "⏭️ 오늘(${DATE_KST}) KR 리포트 이미 발송됨 — skip"
          else
            echo "already=no" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.guard.outputs.already == 'no'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code CLI
        if: steps.guard.outputs.already == 'no'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 정규장 종가 사전 수집 (2026-11-14) — 17시대의 네이버 표시가는 애프터마켓 진행가라, GAS가 정규장 마감 직후 잠근
      # 보유 종목 기록(portfolioMetrics.krClose)과 같은 시각에 받아 둔 시장 숫자(marketClose)를 표로 만들어 에이전트에 넘긴다.
      # 스크립트가 네이버 분봉의 정규장 마감 값과 대조하고, 잠금이 없으면 분봉 값으로 대체한다. 로그에는 개수·상태만(공개 로그).
      # 실패해도 리포트는 계속 — 에이전트가 표 머리의 상태 문구를 보고 지시문의 대체 경로를 탄다.
      # 설계: docs/plans/2026-11-14-정규장종가-마감기록-애프터마켓알림.md
      # 보유 목록의 원본은 GAS 보유현황 하나(2026-11-16) — 지시문에 종목을 적지 않는다. 표가 목록·구분(국내주식/ETF)을 넘기고,
      # 성공할 때마다 docs/reports/_kr_holdings.json(비공개 저장소, 기계가 덮어쓰는 캐시)을 갱신해 GAS 무응답 날의 대체 목록으로 쓴다.
      # 설계: docs/plans/2026-11-16-리포트-보유목록-GAS-단일출처.md
      - name: Pre-fetch close snapshot (정규장 종가·마감 시장 숫자)
        if: steps.guard.outputs.already == 'no'
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
        run: |
          mkdir -p /tmp/kr
          OUT=/tmp/kr/gas_metrics.json
          if [ -z "$GAS_WEB_APP_URL" ] || [ -z "$TG_WEBHOOK_SECRET" ]; then
            echo '{"success":false,"reason":"env-unset"}' > "$OUT"
            echo "pre-fetch: env unset — 네이버 분봉 경로로"
          else
            PAYLOAD=$(jq -n --arg s "$TG_WEBHOOK_SECRET" '{action:"portfolioMetrics", secret:$s}')
            code=$(curl -sS -L -m 60 -o "$OUT" -w '%{http_code}' "$GAS_WEB_APP_URL" \
              -H 'Content-Type: application/json' --data "$PAYLOAD" || echo 000)
            if [ "$code" != "200" ] || ! jq -e '.success == true' "$OUT" >/dev/null 2>&1; then
              echo "{\"success\":false,\"reason\":\"http-$code\"}" > "$OUT"
            fi
            echo "pre-fetch: HTTP=$code success=$(jq -r '.success' "$OUT") krCloseLocked=$(jq -r '.krClose.locked | tostring' "$OUT") marketCloseAt=$(jq -r '.marketClose.at | tostring' "$OUT")"
          fi
          python3 .github/scripts/kr_close_prefetch.py "$OUT" /tmp/kr/close.md "$(TZ='Asia/Seoul' date +%Y-%m-%d)" docs/reports/_kr_holdings.json docs/reports/_config/kr-theses.md \
            --signals docs/reports/_signals.jsonl --signal-out /tmp/kr/signal.json || true

      - name: Generate KR report (Claude CLI headless)
        if: steps.guard.outputs.already == 'no'
        env:
          PROMPT_DIR_IN: ${{ inputs.prompt_dir }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 웹앱 주소·공유 비밀값은 이 단계에 주지 않는다 — 외부 글을 읽고 명령을 실행하는 단계다. 필요한 값은 앞의 사전 수집 단계가 파일로 넘긴다 (2026-11-21)
        run: |
          # 파일명 결정론화 + 권한 bypass — US 첫 시도 실패와 동일 부류 예방 (docs/plans/2026-07-16-US리포트-첫시도실패-수리.md)
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          PDIR="${PROMPT_DIR_IN:-_config}"
          [[ "$PDIR" =~ ^_config(/[A-Za-z0-9_-]+)?$ ]] || PDIR=_config
          PROMPT="docs/reports/${PDIR}/kr-prompt.md"
          [ -f "$PROMPT" ] || PROMPT="docs/reports/_config/kr-prompt.md"
          echo "지시문: ${PROMPT}"
          claude -p "$(cat "$PROMPT")

          [운영 지시] 저장 파일명은 반드시 docs/reports/KR-${DATE_KST}.md — 날짜를 스스로 계산하지 말 것." \
            --allowedTools "WebFetch,Bash,Read,Write" \
            --permission-mode bypassPermissions \
            --max-turns 40 \
            --model claude-sonnet-4-6

      - name: Determine report file path
        if: steps.guard.outputs.already == 'no'
        id: path
        run: |
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          REPORT=docs/reports/KR-${DATE_KST}.md
          echo "date_kst=${DATE_KST}" >> $GITHUB_OUTPUT
          echo "report=${REPORT}" >> $GITHUB_OUTPUT
          if [ -f "$REPORT" ]; then
            echo "found=yes" >> $GITHUB_OUTPUT
            echo "✓ found $REPORT"
            wc -c "$REPORT"   # 본문은 공개 로그에 찍지 않는다 — 실제 실행분은 비공개 저장소 커밋, 시험 실행분은 _dryrun/ (2026-11-16)
          else
            echo "found=no" >> $GITHUB_OUTPUT
            echo "✗ not found $REPORT (실패 — 휴장도 직전거래일 폴백으로 파일 생성이 정상)"
            ls -la docs/reports/ 2>/dev/null || true
          fi


      # 신호 색을 코드 기준으로 맞추고 형식을 점검, 신호 기록을 남긴다. 실패해도 발송은 계속(스크립트가 항상 exit 0).
      - name: Finalize report (신호 색·형식 점검·신호 기록)
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes'
        env:
          DATE_KST: ${{ steps.path.outputs.date_kst }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          FLAG=""; [ "$DRY" = "true" ] && FLAG="--dry"
          python3 .github/scripts/report_finalize.py kr "${{ steps.path.outputs.report }}" \
            --signal /tmp/kr/signal.json --log docs/reports/_signals.jsonl $FLAG > /tmp/kr/finalize.txt || true
          cat /tmp/kr/finalize.txt

      # 무음 실패 제거 (docs/plans/2026-07-03-무음실패-알림.md)
      - name: Alert on generation failure
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'no' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
        run: |
          MSG="⚠️ KR 리포트 생성 실패 (${{ steps.path.outputs.date_kst }}) — 파일 미생성. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IFS=',' read -ra IDS <<< "$TG_CHAT_IDS"
          for id in "${IDS[@]}"; do
            curl -sS -m 15 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="$(echo "$id" | tr -d ' ')" --data-urlencode text="$MSG" >/dev/null || true
          done
          exit 1

      - name: Send to Telegram
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          TG_ONLY: ${{ inputs.only_chat }}
        run: |
          python3 .github/scripts/send_telegram.py "${{ steps.path.outputs.report }}"

      - name: Commit report
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          REPORTS_DEPLOY_KEY: ${{ secrets.REPORTS_DEPLOY_KEY }}
        run: |
          source .github/scripts/reports_git_auth.sh || exit 1
          cd docs/reports
          git config user.email 'actions@github.com'
          git config user.name 'Market Report Bot'
          # 지시문 폴더는 이 실행이 고칠 수 없다 — AI 단계가 건드렸으면 버린다 (다음 실행 오염 방지)
          if [ -n "$(git status --porcelain -- _config)" ]; then
            echo "::warning::_config 변경을 버림 ($(git status --porcelain -- _config | wc -l | tr -d ' ')건)"
            git checkout -q -- _config 2>/dev/null || true
            git clean -fdq -- _config
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "KR report ${{ steps.path.outputs.date_kst }} [skip ci]"
            git push
          fi

      # 시험 실행(dry_run) 결과는 공개 로그 대신 비공개 저장소의 _dryrun/ 폴더에 남긴다. 시험이 건드린 다른 파일은 버린다.
      - name: Save dry-run output (private repo _dryrun/)
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          REPORTS_DEPLOY_KEY: ${{ secrets.REPORTS_DEPLOY_KEY }}
        run: |
          source .github/scripts/reports_git_auth.sh || exit 1
          OUT=/tmp/dryrun_out; mkdir -p "$OUT"
          cp "${{ steps.path.outputs.report }}" "$OUT/report.md"
          for f in /tmp/kr/close.md /tmp/kr/signal.json /tmp/kr/finalize.txt docs/reports/_watch.md docs/reports/_events.md; do
            [ -f "$f" ] && cp "$f" "$OUT/" || true
          done
          cd docs/reports
          git checkout -- .
          git clean -fdq
          git pull -q --rebase
          DEST="_dryrun/kr-${{ steps.path.outputs.date_kst }}-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp "$OUT"/* "$DEST/"
          git config user.email 'actions@github.com'
          git config user.name 'Market Report Bot'
          git add "$DEST"
          git commit -q -m "dry-run kr ${{ steps.path.outputs.date_kst }} [skip ci]"
          if ! git push -q; then
            git pull -q --rebase
            git push -q
          fi
          echo "dry-run 결과 저장: $DEST"

  # ── 주간 리포트 (일요일 13:0x KST) ─────────────────────────────────────────
  # 지난 한 주 리캡(포트+시장 균형) + 새 주 계획. us/kr과 동일 패턴:
  #   주경로=telegram-push 체인이 일요일 13:0x 창 감지 → auto dispatch(드롭 0),
  #   백업=위 cron 2개(13:02/13:42, best-effort), 멱등=WEEK 파일 가드 + job concurrency.
  # 소스: docs/reports/{KR,US}-*.md 5거래일 + _kr_pipeline.md 누적 + GAS portfolioMetrics.
  # 발송은 텔레그램만 — 이메일 단계는 2026-11-15 제거(사용자 결정. 추가 때부터 GAS 제목 허용 목록에 없어 발송된 적 없음, errors.md).
  weekly-report:
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '2 4 * * 0' || github.event.schedule == '42 4 * * 0')) ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 생성이 멈추면 기본 6시간을 쓰고 다음 실행을 막는다 (주간이 약 21분)
    concurrency:
      group: market-report-weekly
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # 뒤 단계(외부 글을 읽는 AI)가 토큰을 읽지 못하게

      # 리포트는 private repo(FD5to6-reports)를 docs/reports 경로에 checkout — 기존 경로 참조(프롬프트·가드·weekly) 전부 무수정.
      # 설계: docs/plans/2026-07-04-리포트-private-분리.md
      - name: Checkout reports (private)
        uses: actions/checkout@v4
        with:
          repository: ejunwon-lab/FD5to6-reports
          ssh-key: ${{ secrets.REPORTS_DEPLOY_KEY }}
          path: docs/reports
          persist-credentials: false   # push 는 커밋 단계에서만 키를 다시 받아 한다 (reports_git_auth.sh)

      - name: Skip if already sent today (schedule·auto dispatch)
        id: guard
        run: |
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          REPORT=docs/reports/WEEK-${DATE_KST}.md
          GUARD_ON=no
          [ "${{ github.event_name }}" = "schedule" ] && GUARD_ON=yes
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto }}" = "true" ] && GUARD_ON=yes
          # 창 밖 자동 실행 차단 (errors.md 2026-10-04)
          if [ "$GUARD_ON" = "yes" ] && ! bash .github/scripts/report_window.sh weekly; then
            echo "already=yes" >> $GITHUB_OUTPUT
            echo "⏭️ 창 밖 자동 실행($(TZ='Asia/Seoul' date '+%a %H:%M') KST) — 주간 리포트 생성 안 함 (지연 cron 날짜 밀림 방지)"
          elif [ "$GUARD_ON" = "yes" ] && [ -f "$REPORT" ]; then
            echo "already=yes" >> $GITHUB_OUTPUT
            echo "⏭️ 이번 주(${DATE_KST}) 주간 리포트 이미 발송됨 — skip"
          else
            echo "already=no" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.guard.outputs.already == 'no'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code CLI
        if: steps.guard.outputs.already == 'no'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # GAS 지표를 step에서 미리 받아 파일로 — 에이전트의 env 유무 판단 오류(6/28 "환경변수 미설정" 오판) 제거.
      # 공개 repo 로그에 응답 본문(보유 구성) 노출 금지 — HTTP 코드·필드 존재 여부만 echo.
      - name: Pre-fetch GAS portfolio metrics
        if: steps.guard.outputs.already == 'no'
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
        run: |
          mkdir -p /tmp/weekly
          OUT=/tmp/weekly/gas_metrics.json
          if [ -z "$GAS_WEB_APP_URL" ] || [ -z "$TG_WEBHOOK_SECRET" ]; then
            echo '{"success":false,"reason":"env-unset"}' > "$OUT"
            echo "pre-fetch: env unset — 에이전트 degrade 경로로"
          else
            PAYLOAD=$(jq -n --arg s "$TG_WEBHOOK_SECRET" '{action:"portfolioMetrics", secret:$s}')
            code=$(curl -sS -L -m 60 -o "$OUT" -w '%{http_code}' "$GAS_WEB_APP_URL" \
              -H 'Content-Type: application/json' --data "$PAYLOAD" || echo 000)
            if [ "$code" != "200" ] || ! jq -e '.success == true' "$OUT" >/dev/null 2>&1; then
              echo "{\"success\":false,\"reason\":\"http-$code\"}" > "$OUT"
            fi
            echo "pre-fetch: HTTP=$code success=$(jq -r '.success' "$OUT") dailyReturns=$(jq -r '.dailyReturns != null' "$OUT")"
          fi
          # 지난 한 주의 숫자(지수·내 포트·종목별 기여)와 주간 신호를 코드가 계산 (2026-11-16). 실패해도 리포트는 계속.
          python3 .github/scripts/weekly_prefetch.py "$OUT" /tmp/weekly/week.md "$(TZ='Asia/Seoul' date +%Y-%m-%d)" \
            --signals docs/reports/_signals.jsonl --signal-out /tmp/weekly/signal.json || true

      - name: Generate weekly report (Claude CLI headless)
        if: steps.guard.outputs.already == 'no'
        env:
          PROMPT_DIR_IN: ${{ inputs.prompt_dir }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 웹앱 주소·공유 비밀값은 이 단계에 주지 않는다 — 외부 글을 읽고 명령을 실행하는 단계다. 필요한 값은 앞의 사전 수집 단계가 파일로 넘긴다 (2026-11-21)
        run: |
          # 파일명 결정론화 + 권한 bypass (docs/plans/2026-07-16-US리포트-첫시도실패-수리.md)
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          PDIR="${PROMPT_DIR_IN:-_config}"
          [[ "$PDIR" =~ ^_config(/[A-Za-z0-9_-]+)?$ ]] || PDIR=_config
          PROMPT="docs/reports/${PDIR}/weekly-prompt.md"
          [ -f "$PROMPT" ] || PROMPT="docs/reports/_config/weekly-prompt.md"
          echo "지시문: ${PROMPT}"
          claude -p "$(cat "$PROMPT")

          [운영 지시] 저장 파일명은 반드시 docs/reports/WEEK-${DATE_KST}.md — 날짜를 스스로 계산하지 말 것." \
            --allowedTools "WebFetch,Bash,Read,Write" \
            --permission-mode bypassPermissions \
            --max-turns 40 \
            --model claude-sonnet-4-6

      - name: Determine report file path
        if: steps.guard.outputs.already == 'no'
        id: path
        run: |
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          REPORT=docs/reports/WEEK-${DATE_KST}.md
          echo "date_kst=${DATE_KST}" >> $GITHUB_OUTPUT
          echo "report=${REPORT}" >> $GITHUB_OUTPUT
          if [ -f "$REPORT" ]; then
            echo "found=yes" >> $GITHUB_OUTPUT
            echo "✓ found $REPORT"
            wc -c "$REPORT"   # 본문은 공개 로그에 찍지 않는다 — 실제 실행분은 비공개 저장소 커밋, 시험 실행분은 _dryrun/ (2026-11-16)
          else
            echo "found=no" >> $GITHUB_OUTPUT
            echo "✗ not found $REPORT (생성 실패)"
            ls -la docs/reports/ 2>/dev/null || true
          fi


      # 신호 색을 코드 기준으로 맞추고 형식을 점검, 신호 기록을 남긴다. 실패해도 발송은 계속(스크립트가 항상 exit 0).
      - name: Finalize report (신호 색·형식 점검·신호 기록)
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes'
        env:
          DATE_KST: ${{ steps.path.outputs.date_kst }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          FLAG=""; [ "$DRY" = "true" ] && FLAG="--dry"
          python3 .github/scripts/report_finalize.py weekly "${{ steps.path.outputs.report }}" \
            --signal /tmp/weekly/signal.json --log docs/reports/_signals.jsonl $FLAG > /tmp/weekly/finalize.txt || true
          cat /tmp/weekly/finalize.txt

      # 무음 실패 제거 (docs/plans/2026-07-03-무음실패-알림.md)
      - name: Alert on generation failure
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'no' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
        run: |
          MSG="⚠️ 주간 리포트 생성 실패 (${{ steps.path.outputs.date_kst }}) — 파일 미생성. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IFS=',' read -ra IDS <<< "$TG_CHAT_IDS"
          for id in "${IDS[@]}"; do
            curl -sS -m 15 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="$(echo "$id" | tr -d ' ')" --data-urlencode text="$MSG" >/dev/null || true
          done
          exit 1

      - name: Send to Telegram
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          TG_ONLY: ${{ inputs.only_chat }}
        run: |
          python3 .github/scripts/send_telegram.py "${{ steps.path.outputs.report }}"

      - name: Commit report
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          REPORTS_DEPLOY_KEY: ${{ secrets.REPORTS_DEPLOY_KEY }}
        run: |
          source .github/scripts/reports_git_auth.sh || exit 1
          cd docs/reports
          git config user.email 'actions@github.com'
          git config user.name 'Market Report Bot'
          # 지시문 폴더는 이 실행이 고칠 수 없다 — AI 단계가 건드렸으면 버린다 (다음 실행 오염 방지)
          if [ -n "$(git status --porcelain -- _config)" ]; then
            echo "::warning::_config 변경을 버림 ($(git status --porcelain -- _config | wc -l | tr -d ' ')건)"
            git checkout -q -- _config 2>/dev/null || true
            git clean -fdq -- _config
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Weekly report ${{ steps.path.outputs.date_kst }} [skip ci]"
            git push
          fi

      # 시험 실행(dry_run) 결과는 공개 로그 대신 비공개 저장소의 _dryrun/ 폴더에 남긴다. 시험이 건드린 다른 파일은 버린다.
      - name: Save dry-run output (private repo _dryrun/)
        if: steps.guard.outputs.already == 'no' && steps.path.outputs.found == 'yes' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          REPORTS_DEPLOY_KEY: ${{ secrets.REPORTS_DEPLOY_KEY }}
        run: |
          source .github/scripts/reports_git_auth.sh || exit 1
          OUT=/tmp/dryrun_out; mkdir -p "$OUT"
          cp "${{ steps.path.outputs.report }}" "$OUT/report.md"
          for f in /tmp/weekly/week.md /tmp/weekly/signal.json /tmp/weekly/finalize.txt docs/reports/_watch.md docs/reports/_events.md; do
            [ -f "$f" ] && cp "$f" "$OUT/" || true
          done
          cd docs/reports
          git checkout -- .
          git clean -fdq
          git pull -q --rebase
          DEST="_dryrun/weekly-${{ steps.path.outputs.date_kst }}-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp "$OUT"/* "$DEST/"
          git config user.email 'actions@github.com'
          git config user.name 'Market Report Bot'
          git add "$DEST"
          git commit -q -m "dry-run weekly ${{ steps.path.outputs.date_kst }} [skip ci]"
          if ! git push -q; then
            git pull -q --rebase
            git push -q
          fi
          echo "dry-run 결과 저장: $DEST"
